name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run completion tests
        run: ./scripts/test.zsh

  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Regenerate from the pinned Vercel CLI version
        run: ./scripts/update.sh "$(cat vercel-version)"

      - name: Fail if _vercel differs from the generator output
        run: git diff --exit-code
